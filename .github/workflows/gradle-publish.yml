name: InteractiveStuff version checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Java 25 compiler and runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build and test the branch target
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a bash ./gradlew --no-daemon build runClientGameTest
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveStuff-${{ github.sha }}
          path: |
            build/*/*/libs/*.jar
            !build/*/*/libs/*-dev.jar
      - name: Upload client diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Client-tests-${{ github.sha }}
          path: |
            build/*/*/run/clientGameTest/screenshots/
            build/*/*/run/clientGameTest/logs/
            build/*/*/run/clientGameTest/crash-reports/
