name: InteractiveStuff version checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Java 25 compiler and runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install software graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Build the branch target
        run: bash ./gradlew --no-daemon build
      - name: Test the real client
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a bash ./gradlew --no-daemon runClientGameTest
      - name: Test Mod Menu without YACL
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a bash ./gradlew --no-daemon -Pconfig_screen_test_yacl=false runClientGameTest
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveStuff-${{ github.sha }}
          path: |
            build/*/*/libs/*.jar
            !build/*/*/libs/*-dev.jar
      - name: Upload client diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Client-tests-${{ github.sha }}
          path: |
            build/*/*/run/clientGameTest*/screenshots/
            build/*/*/run/clientGameTest*/logs/
            build/*/*/run/clientGameTest*/crash-reports/
