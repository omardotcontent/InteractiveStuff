plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.terraformersmc.com/releases" }

    flatDir {
        dirs 'libs' // Points to the 'libs' folder in your project root
    }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    implementation files("libs/Vyn.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {

    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // Bundle the interpreter in the ordinary distributable, not a separate shadow artifact.
    from(zipTree("libs/Vyn.jar")) {
        exclude "META-INF/**"
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}


sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register("runtimeRegression", JavaExec) {
    group = "verification"
    description = "Runs deterministic runtime, scheduler, rendering math, and bundled-script checks."
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = "omar.projects.interactivestuff.RuntimeRegressionChecks"
    workingDir = projectDir
}

tasks.named("check") {
    dependsOn tasks.named("runtimeRegression"), tasks.named("verifyReleaseJar")
}

// Client integration tests live in a separate test mod and isolated game directory.
fabricApi.configureTests {
    createSourceSet = true
    modId = "interactivestuff_test"
    enableGameTests = false
    enableClientGameTests = true
    eula = false
}


tasks.register("verifyReleaseJar") {
    group = "verification"
    description = "Checks bundled interpreter, license, metadata and release/test separation."
    dependsOn tasks.named("jar")
    inputs.file(tasks.named("jar").flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(tasks.named("jar").get().archiveFile.get().asFile).withCloseable { archive ->
            def entries = archive.entries().collect { it.name }
            ["fabric.mod.json", "interactivestuff.mixins.json", "me/abdelaziz/main/VynMain.class",
             "LICENSE.txt_${project.base.archivesName.get()}"].each { required ->
                if (!entries.contains(required.toString())) throw new GradleException("Release JAR is missing ${required}")
            }
            if (entries.any { it.startsWith("net/minecraft/") || it.contains("ClientRenderChecks") || it.contains("RuntimeRegressionChecks") }) {
                throw new GradleException("Release JAR contains game or test classes")
            }
            def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry("fabric.mod.json")))
            if (metadata.depends.minecraft != "~${project.minecraft_version}" || metadata.depends.java != ">=25") {
                throw new GradleException("Release metadata does not match the selected Minecraft/Java target")
            }
        }
    }
}
