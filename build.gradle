plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.19' apply false
    id 'base'
    id 'idea'
}

abstract class MinecraftClientService implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}

// Only one graphical client may run at once, including when Gradle uses --parallel.
ext.clientExecution = gradle.sharedServices.registerIfAbsent('minecraftClients', MinecraftClientService) {
    maxParallelUsages = 1
}

ext.minecraftTargets = new groovy.json.JsonSlurper().parse(file('gradle/targets.json'))
version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('maven_group').get()
idea.project.languageLevel = '25'

// Profiles select a default convenience command, never the set of imported IDE modules.
def selectedProfile = providers.gradleProperty('target_version').getOrElse('26.2')
def selectedPatch = providers.gradleProperty('minecraftPatch').orNull
if (selectedPatch && (selectedProfile != '26.1.X' || !(selectedPatch in ['26.1', '26.1.1', '26.1.2']))) {
    throw new GradleException('minecraftPatch supports only 26.1, 26.1.1 or 26.1.2 with target_version=26.1.X')
}
def selectedModule = selectedPatch && selectedPatch != '26.1' ? selectedPatch : selectedProfile
if (!minecraftTargets.any { it.module == selectedModule }) {
    throw new GradleException("Unknown target ${selectedModule}; run ./gradlew commands")
}

def delegateTask = { String taskName, String module, String action, String taskDescription ->
    tasks.register(taskName) {
        group = 'interactivestuff'
        description = taskDescription
        dependsOn ":${module}:${action}"
    }
}
minecraftTargets.each { target ->
    delegateTask("build${target.suffix}", target.module, 'build', "Builds and checks Minecraft ${target.module}.")
    delegateTask("run${target.suffix}", target.module, 'runClient', "Launches Minecraft ${target.module} with IS and optional Mod Menu.")
    delegateTask("test${target.suffix}", target.module, 'runClientGameTest', "Runs the real client tests on Minecraft ${target.module}.")
    delegateTask("sources${target.suffix}", target.module, 'genSources', "Generates Minecraft ${target.module} sources for browsing in the IDE.")
}
delegateTask('buildSelected', selectedModule, 'build', 'Builds the default target from gradle.properties or -Ptarget_version.')
delegateTask('runSelected', selectedModule, 'runClient', 'Launches the default Minecraft target.')
delegateTask('testSelected', selectedModule, 'runClientGameTest', 'Tests the default Minecraft target.')

def aggregate = { String taskName, String action, String taskDescription ->
    tasks.register(taskName) {
        group = 'interactivestuff'
        description = taskDescription
        dependsOn minecraftTargets.collect { ":${it.module}:${action}" }
    }
}
aggregate('buildAll', 'build', 'Builds and checks all supported Minecraft releases.')
aggregate('checkAll', 'check', 'Runs shared regression and release-JAR checks for every target.')
aggregate('testAll', 'runClientGameTest', 'Runs all real-client tests sequentially; needs a graphics display.')
aggregate('cleanAll', 'clean', 'Deletes target build outputs; keeps version-specific development saves.')
aggregate('prepareIde', 'ideaSyncTask', 'Refreshes inherited sources/resources and creates all IntelliJ client run configurations.')
tasks.named('prepareIde') {
    doLast {
        // The former root module no longer exists. Preserve old Loom-generated configs before removing them.
        ['Minecraft_Client.xml', 'Minecraft_Server.xml', 'Gametest_Minecraft_Client_Game_Test.xml'].each { name ->
            def oldConfig = file(".idea/runConfigurations/${name}")
            if (oldConfig.isFile()) {
                def content = oldConfig.getText('UTF-8')
                if (content.contains('net.fabricmc.devlaunchinjector.Main')
                        && (content.contains('module name="InteractiveStuff.') || content.contains('module name="omar.projects.InteractiveStuff.'))) {
                    def backup = layout.buildDirectory.file("ide-config-backups/${name}").get().asFile
                    backup.parentFile.mkdirs()
                    java.nio.file.Files.copy(oldConfig.toPath(), backup.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    delete(oldConfig)
                }
            }
        }
    }
}

tasks.named('build') { dependsOn tasks.named('buildAll') }
tasks.named('check') { dependsOn tasks.named('checkAll') }
// A missing/invalid translation must fail ordinary per-version builds as well as releases.
tasks.register('verifyTranslations') {
    group = 'verification'
    description = 'Checks locale coverage and translation format arguments.'
    def languages = file('src/main/resources/assets/interactivestuff/lang')
    inputs.dir(languages)
    doLast {
        def expected = ['en_us', 'nl_nl', 'fil_ph', 'fr_fr', 'fr_ca', 'pl_pl', 'zh_cn', 'es_ar', 'es_mx', 'tr_tr', 'uk_ua', 'th_th', 'hi_in', 'en_gb', 'en_ca', 'en_au']
        def source = new groovy.json.JsonSlurper().parse(new File(languages, 'en_us.json'), 'UTF-8')
        def arguments = { String text -> (text =~ /%[0-9]+[$]s/).findAll().sort() }
        expected.each { locale ->
            def translated = new groovy.json.JsonSlurper().parse(new File(languages, "${locale}.json"), 'UTF-8')
            if (translated.keySet() != source.keySet()) throw new GradleException("Translation keys differ for ${locale}")
            source.each { key, value ->
                if (!(translated[key] instanceof String) || translated[key].isEmpty()
                        || arguments(translated[key]) != arguments(value))
                    throw new GradleException("Invalid translation/format arguments: ${locale}:${key}")
            }
        }
        println "Verified ${expected.size()} complete locales (${source.size()} keys each)."
    }
}

// Stage only verified distributables, never development/source JARs or old directory contents.
def distributionDirectory = layout.buildDirectory.dir("dist/${version}")
def stageRelease = tasks.register('stageRelease', Sync) {
    group = 'distribution'
    description = 'Collects the verified release JARs and release notes.'
    dependsOn tasks.named('buildAll')
    into distributionDirectory
    from('LICENSE.txt', 'CHANGELOG.md', 'README.md')
}
subprojects { targetProject ->
    targetProject.afterEvaluate {
        def releaseJar = targetProject.tasks.named(targetProject.mapped == 'true' ? 'remapJar' : 'jar')
        stageRelease.configure { from(releaseJar.flatMap { it.archiveFile }) }
    }
}

def releaseChecksums = tasks.register('releaseChecksums') {
    group = 'distribution'
    description = 'Writes SHA-256 checksums for the current release JARs.'
    dependsOn stageRelease
    def jarFiles = distributionDirectory.map { directory -> fileTree(directory) { include '*.jar' } }
    inputs.files(jarFiles)
    outputs.file(distributionDirectory.map { it.file('SHA256SUMS.txt') })
    doLast {
        def jars = jarFiles.get().files.sort { it.name }
        if (jars.size() != minecraftTargets.size()) throw new GradleException('Release staging does not match the target catalog')
        def lines = jars.collect { jar ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            jar.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int length
                while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length)
            }
            "${digest.digest().encodeHex()}  ${jar.name}"
        }
        distributionDirectory.get().file('SHA256SUMS.txt').asFile.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}
tasks.register('releaseAll', Zip) {
    group = 'interactivestuff'
    description = 'Builds all targets and packages the upload JARs, notes and SHA-256 checksums.'
    dependsOn releaseChecksums
    from distributionDirectory
    destinationDirectory = layout.buildDirectory.dir('dist')
    archiveFileName = "InteractiveStuff-${version}-all-versions.zip"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('commands') {
    group = 'interactivestuff'
    description = 'Prints the supported versions and everyday Gradle commands.'
    doLast {
        println 'InteractiveStuff multi-version workspace'
        println '  ./gradlew prepareIde   Refresh all IDE source adapters and client run configurations'
        println '  ./gradlew buildAll     Build and check every Minecraft version'
        println '  ./gradlew releaseAll   Package upload JARs in build/dist/'
        println '  ./gradlew testAll      Run all real-client tests (requires a display)'
        println '  ./gradlew cleanAll     Clean build outputs while preserving development saves'
        println ''
        println 'Minecraft    Build              Play               Client tests'
        minecraftTargets.each { target ->
            println String.format('%-12s %-18s %-18s %s', target.module, "build${target.suffix}", "run${target.suffix}", "test${target.suffix}")
        }
        println ''
        println "Default target: ${selectedModule} (buildSelected / runSelected / testSelected)"
        println 'Edit src/ for shared code and scripts; edit versions/<profile>/src/ for native adapters.'
        println 'Use sources<version> to decompile Minecraft for IDE browsing, e.g. sources26_2.'
        println 'Read docs/IDE_WORKFLOW.md for the complete command reference.'
    }
}
defaultTasks ':commands'
