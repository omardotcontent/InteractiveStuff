// One module per Minecraft release, all using the same build rules.
def target = rootProject.minecraftTargets.find { it.module == project.name }
if (target == null) throw new GradleException("No Minecraft profile for ${project.path}")
def selectedTarget = target.profile
def configScreenTestModmenu = providers.gradleProperty("config_screen_test_modmenu").getOrElse("true").toBoolean()
def profileFile = rootProject.file("versions/${selectedTarget}/version.properties")
def profile = new Properties()
profileFile.withInputStream { profile.load(it) }
// Patch releases can have different Fabric API baselines while sharing native adapters.
if (target.patch) {
    def patchProfile = rootProject.file("${target.directory}/version.properties")
    if (patchProfile.isFile()) patchProfile.withInputStream { profile.load(it) }
}
profile.each { key, value -> project.ext.set(key.toString(), value.toString()) }
if (target.patch) project.ext.minecraft_version = target.patch
apply plugin: (project.mapped == "true" ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom")

apply plugin: 'maven-publish'
apply plugin: 'idea'

layout.buildDirectory = rootProject.layout.buildDirectory.dir("${selectedTarget}/${project.minecraft_version}")
def targetJavaVersion = project.java_version.toInteger()
// Optional Mod Menu can itself need a newer Loader than IS. Keep that development
// runtime requirement separate from IS's own minimum in fabric.mod.json.
def developmentLoaderVersion = configScreenTestModmenu
        ? profile.getProperty("modmenu_loader_version", project.loader_version) : project.loader_version
def minecraftCompatibility = profile.getProperty("minecraft_compatibility", selectedTarget == "26.1.X" ? "~26.1" : selectedTarget == "1.20.1" ? "1.20.1" : "~${project.minecraft_version}")
def standaloneClientTests = targetJavaVersion <= 17 || profile.getProperty("client_test_runner") == "legacy"
// Test fixtures are local-only; clean GitHub checkouts must still build and import in the IDE.
def hasLocalRegressionTests = rootProject.file("src/regression/java/omar/projects/interactivestuff/RuntimeRegressionChecks.java").isFile()
def hasLocalClientTests = standaloneClientTests
        ? rootProject.file("versions/${selectedTarget}/src/gametest/java/omar/projects/interactivestuff/LegacyClientChecks.java").isFile()
        : rootProject.file("src/gametest/java/omar/projects/interactivestuff/ClientRenderChecks.java").isFile()

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}
def releaseLicenseName = "LICENSE.txt_${base.archivesName.get()}".toString()


repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases" }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.mapped == "true") mappings loom.officialMojangMappings()
    if (project.mapped == "true") {
        modImplementation "net.fabricmc:fabric-loader:${developmentLoaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        // We select Loader/Fabric API explicitly. Mod Menu's Maven build dependencies
        // can be newer than its published runtime minimum and must not raise our baseline.
        modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
        // Exercise optional settings integrations in development and client tests.
        // localRuntime dependencies are excluded from publication and the release JAR.
        if (configScreenTestModmenu) modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    } else {
        implementation "net.fabricmc:fabric-loader:${developmentLoaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
        if (configScreenTestModmenu) localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    }

    implementation files(rootProject.file("libs/Vyn.jar"))
}

def resourceValues = [
        version: project.version,
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version,
        fabric_api_version: project.fabric_api_version,
        modmenu_version: project.modmenu_version,
        java_version: targetJavaVersion,
        minecraft_compatibility: minecraftCompatibility
]
processResources {
    inputs.properties(resourceValues)
    filteringCharset = "UTF-8"

    filesMatching(["fabric.mod.json", "interactivestuff.mixins.json", "resourcepacks/interactive_resourcepack/pack.mcmeta"]) {
        expand(resourceValues)
    }
}

tasks.withType(JavaCompile).configureEach {

    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)

    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE.txt")) {
        rename { releaseLicenseName }
    }
    // Bundle the interpreter in the ordinary distributable, not a separate shadow artifact.
    from(zipTree(rootProject.file("libs/Vyn.jar"))) {
        exclude "META-INF/**"
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}


sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register("runtimeRegression", JavaExec) {
    group = "verification"
    description = "Runs deterministic runtime, scheduler, rendering math, and bundled-script checks."
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = "omar.projects.interactivestuff.RuntimeRegressionChecks"
    workingDir = rootProject.projectDir
    // Headless math checks use JOML's NIO path; the game's runtime keeps its defaults.
    systemProperty "joml.nounsafe", "true"
    doFirst {
        if (!hasLocalRegressionTests) throw new GradleException("Runtime test fixtures are local-only and are not included in this checkout.")
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyReleaseJar"), rootProject.tasks.named("verifyTranslations")
    if (hasLocalRegressionTests) dependsOn tasks.named("runtimeRegression")
}

// Client integration tests live in a separate test mod and isolated game directory.
if (hasLocalClientTests && !standaloneClientTests) fabricApi.configureTests {
    createSourceSet = true
    modId = "interactivestuff_test"
    enableGameTests = false
    enableClientGameTests = true
    eula = false
}
if (!hasLocalClientTests) {
    sourceSets.create('gametest')
    tasks.register('runClientGameTest') {
        group = 'verification'
        description = 'Requires the local-only native client test fixtures.'
        doLast { throw new GradleException("Native client test fixtures are local-only and are not included in this checkout.") }
    }
} else if (standaloneClientTests) {
    sourceSets.create('gametest')
    loom.runs.create('clientGameTest') {
        client()
        source sourceSets.gametest
        vmArg '-Dinteractivestuff.clientTest=true'
    }
    loom.mods.create('interactivestuff_test') { sourceSet sourceSets.gametest }
}
sourceSets.gametest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gametest.runtimeClasspath += sourceSets.main.runtimeClasspath
def clientTestDirectory = configScreenTestModmenu ? "clientGameTest" : "clientGameTestWithoutModmenu"
loom.mods {
    interactivestuff { sourceSet sourceSets.main }
}
loom.runs.configureEach {
    generateRunConfig = name == "client"
    preferGradleTask = true
    ideConfigFolder = "InteractiveStuff"
}
loom.runs.named("client") {
    displayName = "IS Minecraft ${project.minecraft_version}"
    appendProjectPathToDisplayName = false
    // Ordinary development saves survive clean and are isolated by Minecraft release.
    runDirectory = rootProject.file("run/${project.minecraft_version}")
}
if (hasLocalClientTests) loom.runs.named("clientGameTest") {
    runDirectory = rootProject.file("build/${selectedTarget}/${project.minecraft_version}/run/${clientTestDirectory}")
}
// Gradle-backed IDE run configs use the correct runtime automatically.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(targetJavaVersion) }
}
['runClient', 'runClientGameTest'].each { taskName ->
    tasks.named(taskName) { usesService rootProject.clientExecution }
}


tasks.register("verifyReleaseJar") {
    group = "verification"
    description = "Checks bundled interpreter, license, metadata and release/test separation."
    def releaseJar = tasks.named(project.mapped == "true" ? "remapJar" : "jar")
    dependsOn releaseJar
    inputs.file(releaseJar.flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(releaseJar.get().archiveFile.get().asFile).withCloseable { archive ->
            def entries = archive.entries().collect { it.name }
            ["fabric.mod.json", "interactivestuff.mixins.json", "me/abdelaziz/main/VynMain.class",
             releaseLicenseName].each { required ->
                if (!entries.contains(required.toString())) throw new GradleException("Release JAR is missing ${required}")
            }
            def fixtureClasses = ['ClientRenderChecks', 'ClientConfigScreenChecks', 'ClientStateChecks', 'ClientParticleChecks',
                                  'ClientLocalizationChecks', 'ClientPivotChecks', 'ClientSettingsCanvas', 'ClientKeyboardChecks', 'DependencyBaselineChecks', 'LegacyClientChecks', 'LegacyTintChecks', 'LegacyParticleDirectionChecks']
            if (entries.any { path ->
                path.startsWith("net/minecraft/") || path.startsWith("assets/interactivestuff_test/") || path.contains("/testmixin/")
                        || path.startsWith("docs/") || path.startsWith(".impeccable/") || path.startsWith("src/gametest/")
                        || path.startsWith("src/regression/") || path.startsWith("src/test/") || path.contains("RegressionChecks")
                        || fixtureClasses.any { name -> path.contains("/${name}.") || path.contains("/${name}\$") }
            }) {
                throw new GradleException("Release JAR contains game classes, local documentation or test fixtures")
            }
            entries.findAll { it.endsWith(".class") }.each { path ->
                byte[] header = archive.getInputStream(archive.getEntry(path)).withCloseable { it.readNBytes(8) }
                int major = ((header[6] & 255) << 8) | (header[7] & 255)
                if (major > targetJavaVersion + 44 || (path.startsWith("omar/") && major != targetJavaVersion + 44))
                    throw new GradleException("${path} has incompatible Java class version ${major}")
            }
            def mixinMetadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry("interactivestuff.mixins.json")))
            if (mixinMetadata.compatibilityLevel != "JAVA_${targetJavaVersion}")
                throw new GradleException("Mixin Java compatibility does not match the target")
            if (!mixinMetadata.client.contains("render.FirstPersonParticleMixin"))
                throw new GradleException("Release JAR is missing the first-person particle render hook")
            def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry("fabric.mod.json")))
            if (metadata.depends.fabricloader != ">=${profile.getProperty('loader_version')}"
                    || metadata.depends['fabric-api'] != ">=${profile.getProperty('fabric_api_version')}"
                    || metadata.suggests.modmenu != ">=${profile.getProperty('modmenu_version')}"
                    || metadata.depends.containsKey('modmenu'))
                throw new GradleException("Release dependency minimums do not match the target profile or make Mod Menu mandatory")
            if (metadata.depends.minecraft != (minecraftCompatibility) || metadata.depends.java != ">=${targetJavaVersion}") {
                throw new GradleException("Release metadata does not match the selected Minecraft/Java target")
            }
        }
    }
}

// Resolve paths once, with the selected adapter taking precedence over inherited ones.
def overlayTargets = []
def visited = [] as Set
def cursorTarget = selectedTarget
while (cursorTarget) {
    if (!visited.add(cursorTarget)) throw new GradleException("Cyclic version adapter inheritance")
    overlayTargets.add(0, cursorTarget)
    def inheritedProfile = new Properties()
    rootProject.file("versions/${cursorTarget}/version.properties").withInputStream { inheritedProfile.load(it) }
    cursorTarget = inheritedProfile.getProperty("base_target")
}
def nativeNames = { String original ->
    if (profile.getProperty("legacy_names") != "true") return original
    def renamed = original.replaceAll(/\bIdentifier\b/, "ResourceLocation")
            .replace(".identifier()", ".location()")
            .replace(".getIdentifier()", ".getLocation()")
            .replace("net.minecraft.util.Util", "net.minecraft.Util")
            .replace("net.minecraft.client.renderer.rendertype.RenderType", "net.minecraft.client.renderer.RenderType")
    if (profile.getProperty('legacy_models') == 'true' && profile.getProperty('legacy_resource_locations', 'true') == 'true')
        renamed = renamed.replace('ResourceLocation.parse(', 'new ResourceLocation(')
                .replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
                .replace('.getFirst()', '.get(0)')
    return renamed
}
def prepareSources = tasks.register("prepareSources") {
    group = "ide"
    description = "Refreshes inherited source/resource copies for Minecraft ${project.minecraft_version}."
}
def configureOverlays = { sourceSet, category, kind ->
    def extension = kind == "java" ? "**/*.java" : "**/*"
    def roots = [rootProject.file("src/${category}/${kind}")] + overlayTargets.collect {
        rootProject.file("versions/${it}/src/${category}/${kind}")
    }
    // Only 26.2 owns the editable shared sources. Native adapters belong to their profile module.
    // Patch modules inherit 26.1.X rather than attaching its source directory a second time.
    def ownedRoot = selectedTarget == "26.2" ? roots[0] :
            (target.module == selectedTarget ? rootProject.file("versions/${selectedTarget}/src/${category}/${kind}") : null)
    def winners = [:]
    roots.each { sourceRoot ->
        if (sourceRoot.isDirectory()) fileTree(sourceRoot).matching { include extension }.files.each { source ->
            def relativePath = sourceRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            winners[relativePath] = [root: sourceRoot, file: source]
        }
    }
    if (profile.getProperty('excluded_sources') && kind == 'java')
        profile.getProperty('excluded_sources').split(',').each { winners.remove(it) }
    // Releases without Fabric's client-gametest API supply their own isolated fixture.
    if (standaloneClientTests && category == 'gametest')
        winners = winners.findAll { path, source -> source.root == ownedRoot
                || path == 'omar/projects/interactivestuff/DependencyBaselineChecks.java' }
    def inherited = winners.findAll { path, source -> source.root != ownedRoot }
    def generatedRoot = layout.buildDirectory.dir("generated/${kind == 'java' ? 'sources' : 'resources'}/${category}/${kind}").get().asFile
    // A native adapter is edited directly in the IDE, so it must already use its native names.
    if (kind == "java" && profile.getProperty("legacy_names") == "true") {
        winners.findAll { path, source -> source.root == ownedRoot }.each { path, source ->
            def code = source.file.getText("UTF-8")
            if (nativeNames(code) != code)
                throw new GradleException("Use native Minecraft names in editable adapter ${source.file}; shared name substitutions belong in src/.")
        }
    }
    def generator = tasks.register("generate${category.capitalize()}${kind == 'java' ? 'Adapters' : 'Resources'}") {
        inputs.files(inherited.values().collect { it.file })
        inputs.property("origins", inherited.collectEntries { path, source -> [path, rootProject.relativePath(source.file)] })
        inputs.property("legacy_names", kind == "java" ? profile.getProperty("legacy_names", "false") : "false")
        inputs.property("legacy_models", profile.getProperty("legacy_models", "false"))
        inputs.property("legacy_resource_locations", profile.getProperty("legacy_resource_locations", "true"))
        outputs.dir(generatedRoot)
        doLast {
            delete(generatedRoot)
            generatedRoot.mkdirs()
            inherited.each { path, source ->
                def destination = new File(generatedRoot, path)
                destination.parentFile.mkdirs()
                if (kind == "java") destination.setText(nativeNames(source.file.getText("UTF-8")), "UTF-8")
                else java.nio.file.Files.copy(source.file.toPath(), destination.toPath())
            }
        }
    }
    def sourceDirs = (ownedRoot == null ? [] : [ownedRoot]) + [generatedRoot]
    if (kind == "java") {
        sourceSet.java.setSrcDirs(sourceDirs)
        tasks.named(sourceSet.compileJavaTaskName) { dependsOn generator }
        idea.module.generatedSourceDirs += generatedRoot
    } else {
        sourceSet.resources.setSrcDirs(sourceDirs)
        tasks.named(sourceSet.processResourcesTaskName) { dependsOn generator }
    }
    if (category == "main") tasks.named("sourcesJar") { dependsOn generator }
    prepareSources.configure { dependsOn generator }
}
[sourceSets.main, sourceSets.regression, sourceSets.gametest].each { sourceSet ->
    configureOverlays(sourceSet, sourceSet.name, "java")
    configureOverlays(sourceSet, sourceSet.name, "resources")
}
idea.module.testSources.from(sourceSets.regression.java.srcDirs, sourceSets.gametest.java.srcDirs)
idea.module.testResources.from(sourceSets.regression.resources.srcDirs, sourceSets.gametest.resources.srcDirs)
// IntelliJ imports the unique generated source roots with each target's own Minecraft classpath.
tasks.named("ideaSyncTask") { dependsOn prepareSources }

// Verify old releases on their actual Java runtime, while release compilation uses --release.
if (hasLocalClientTests) tasks.named("runClientGameTest", JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(targetJavaVersion) }
    systemProperty "interactivestuff.expectedLoader", developmentLoaderVersion
    systemProperty "interactivestuff.expectedFabricApi", project.fabric_api_version
    systemProperty "interactivestuff.expectedModMenu", configScreenTestModmenu ? project.modmenu_version : "absent"
    def focus = providers.gradleProperty("client_test_focus").getOrElse("")
    if (!focus.isEmpty()) systemProperty "interactivestuff.clientTestFocus", focus
    // An explicitly supplied display already has its own X server (including CI's wrapper).
    if (providers.environmentVariable("DISPLAY").isPresent()) useXvfb = false
    // Fabric's older test packet synchronizer can stall initial chunk loading on CI.
    // Native assertions still wait for actual client state; this affects only the test process.
    if (profile.getProperty("client_test_async_network") == "true")
        systemProperty "fabric.client.gametest.disableNetworkSynchronizer", ""
    // 26.3 requests an accelerated GLX visual. Mesa's software CI renderer works through EGL.
    if (selectedTarget == "26.3" && System.getProperty("os.name").startsWith("Linux")
            && providers.environmentVariable("CI").isPresent())
        environment "SDL_VIDEO_FORCE_EGL", "1"
}

if (profile.getProperty("excluded_resources")) sourceSets.main.resources.exclude(profile.getProperty("excluded_resources").split(","))
